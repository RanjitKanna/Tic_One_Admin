name: Admin Web Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Web
        run: flutter build web --release --dart-define=IS_PRODUCTION=true

      - name: Verify web build output
        run: |
          for f in index.html flutter_bootstrap.js main.dart.js manifest.json vercel.json favicon.png; do
            test -e "build/web/$f" || { echo "::error::build/web/$f is missing"; exit 1; }
          done

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-release
          path: build/web
          retention-days: 7

  # Preview deploy for every PR opened from this repository (forks have no access to secrets)
  deploy-preview:
    name: Deploy Preview (Vercel)
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set"; exit 1; }
          done

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: admin-web-release
          path: build/web

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy build/web --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Admin web preview for ${context.sha.slice(0, 7)}: ${process.env.PREVIEW_URL}`,
            });

  # Production deploy on pushes to main, version tags, or manual runs
  deploy-production:
    name: Deploy Production (Vercel)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set"; exit 1; }
          done

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: admin-web-release
          path: build/web

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy build/web --prod --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"
